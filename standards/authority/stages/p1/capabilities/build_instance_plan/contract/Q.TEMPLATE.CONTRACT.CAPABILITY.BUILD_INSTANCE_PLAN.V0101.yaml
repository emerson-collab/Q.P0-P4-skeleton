operations:
  build_instance_plan:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/build_instance_plan
    semantic_role: DETERMINISTIC_INSTANCE_PLAN_ORCHESTRATION
    requires: &id003
    - COMPILED_CONTRACT
    - GOVERNED_CURRENT_LOCATOR_STATE
    - GOVERNED_TEMPLATE_AUTHORITY_SET
    - EXPLICIT_GOVERNED_BINDING_INPUTS
    produces: EXACT_INSTANCE_PLAN
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/build_instance_plan_invoke
    requirements:
    - invoke the six internal suboperations strictly in execution_pipeline.internal_suboperation_order
    - pass only standard interface envelope fields plus owner-local schema-bound input payload
    - return only after exact Instance Plan closure is verified
    - fail closed without invoking AI or bypassing an internal interface
  resolve_authority_snapshot:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/resolve_authority_snapshot
    semantic_role: GOVERNED_CURRENT_AUTHORITY_RESOLUTION
    requires: &id004
    - COMPILED_CONTRACT
    - GOVERNED_CURRENT_LOCATOR_STATE
    produces: EXACT_AUTHORITY_SNAPSHOT
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/resolve_authority_snapshot_invoke
    requirements:
    - resolve every required stable CURRENT reference to one exact Contract ref and SHA-256
    - preserve Q.Standard as locator and selected-state authority rather than semantic authority
    - fail closed on unresolved duplicate inconsistent or integrity-invalid authority
  resolve_physical_manifest:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/resolve_physical_manifest
    semantic_role: EXACT_PHYSICAL_PROJECTION_RESOLUTION
    requires: &id005
    - COMPILED_CONTRACT
    - EXACT_AUTHORITY_SNAPSHOT
    produces: EXACT_PHYSICAL_MANIFEST
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/resolve_physical_manifest_invoke
    requirements:
    - derive target file paths only from Contract-declared physical semantics and selected Stage physical authorities
    - forbid inferred relocated convenience or undeclared paths
    - preserve exact Stage physical closure
  resolve_template_set:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/resolve_template_set
    semantic_role: GOVERNED_TEMPLATE_RESOLUTION
    requires: &id006
    - EXACT_PHYSICAL_MANIFEST
    - EXACT_AUTHORITY_SNAPSHOT
    - GOVERNED_TEMPLATE_AUTHORITY_SET
    produces: EXACT_TEMPLATE_SET
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/resolve_template_set_invoke
    requirements:
    - resolve exactly one governed template identity and content hash for every renderable manifest file role
    - select templates only by governed profile role and authority bindings
    - forbid raw-newest numeric-highest fallback or AI-selected templates
    - fail closed when zero or more than one eligible exact template remains
  resolve_binding_set:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/resolve_binding_set
    semantic_role: EXACT_BINDING_RESOLUTION
    requires: &id007
    - COMPILED_CONTRACT
    - EXACT_PHYSICAL_MANIFEST
    - EXACT_TEMPLATE_SET
    - EXPLICIT_GOVERNED_BINDING_INPUTS
    produces: EXACT_BINDING_SET
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/resolve_binding_set_invoke
    requirements:
    - bind every template variable to one exact Contract fact or explicit governed binding declaration
    - preserve Capability Instance and Binding Declaration authority boundaries
    - forbid inferred default provider port policy secret instance identity or business semantic value
    - fail closed on unresolved ambiguous or undeclared binding input
  render_file_set:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/render_file_set
    semantic_role: DETERMINISTIC_TEMPLATE_RENDERING
    requires: &id008
    - EXACT_TEMPLATE_SET
    - EXACT_BINDING_SET
    - EXACT_PHYSICAL_MANIFEST
    produces: EXACT_RENDERED_FILE_SET
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/render_file_set_invoke
    requirements:
    - render only governed template bytes plus exact resolved binding values
    - perform no LLM model AI code synthesis interpretation semantic completion or free-form repair
    - produce identical bytes for identical template hashes binding hashes authority snapshot and capability version
    - forbid unresolved template tokens
  compile_instance_plan:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/compile_instance_plan
    semantic_role: EXACT_INSTANCE_PLAN_FINALIZATION
    requires: &id009
    - COMPILED_CONTRACT
    - EXACT_AUTHORITY_SNAPSHOT
    - EXACT_PHYSICAL_MANIFEST
    - EXACT_TEMPLATE_SET
    - EXACT_BINDING_SET
    - EXACT_RENDERED_FILE_SET
    produces: EXACT_INSTANCE_PLAN
    primary_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/compile_instance_plan_invoke
    requirements:
    - compute SHA-256 for every rendered target file
    - bind every file to exact template ref hash and binding-set hash
    - verify rendered file set equals exact physical manifest
    - compute deterministic replay identity
    - return final files mapping with content and SHA-256 already closed
    - fail closed on path template binding authority interface file-set or hash mismatch
execution_pipeline:
  order:
  - build_instance_plan
  - resolve_authority_snapshot
  - resolve_physical_manifest
  - resolve_template_set
  - resolve_binding_set
  - render_file_set
  - compile_instance_plan
  entry_operation: build_instance_plan
  internal_suboperation_order:
  - resolve_authority_snapshot
  - resolve_physical_manifest
  - resolve_template_set
  - resolve_binding_set
  - render_file_set
  - compile_instance_plan
  internal_suboperation_calls_use_p1_internal_call: true
  direct_handler_chaining_forbidden: true
  reordering_forbidden: true
  partial_plan_acceptance_forbidden: true
  steady_state_model_or_llm_call_forbidden: true
  q_prompt_runtime_dependency_forbidden: true
input_contract:
  required:
  - compiled_contract
  - governed_current_locator_state
  - governed_template_authority_set
  - explicit_governed_binding_inputs
  final_target_file_content_as_caller_input_forbidden: true
  caller_may_supply_governed_template_bytes_only_with_exact_template_ref_and_hash: true
  caller_may_supply_binding_values_only_with_declared_binding_identity_and_authority: true
output_contract:
  result_kind: INSTANCE_PLAN
  required:
  - source_contract_ref
  - source_contract_hash
  - authority_snapshot
  - physical_manifest_hash
  - template_input_hash
  - binding_input_hash
  - files
  - replay_identity_hash
  files_entry_required:
  - content
  - sha256
  - template_ref
  - template_hash
  - binding_hash
  repository_bytes_already_final: true
  authoritative_business_semantics: false
  gate_pass_generated: false
  activation_generated: false
deterministic_replay_identity:
  inputs:
  - exact_source_contract_ref_hash_and_content
  - exact_governed_current_authority_snapshot
  - exact_template_ref_hash_and_bytes_set
  - exact_binding_declaration_and_value_set
  - Q.TEMPLATE.CAPABILITY.BUILD_INSTANCE_PLAN@V0101
  invariant: identical replay identity inputs produce the same exact physical manifest rendered file bytes file hashes and
    Instance Plan
