responsibilities:
- compile an exact deterministic repository projection plan from one compiled business Contract and governed CURRENT authorities
- resolve the exact applicable Meta and P0-P4 authority snapshot
- resolve exact physical file manifest only from Contract and selected Stage physical authorities
- resolve one exact governed template for every renderable file role
- resolve all template bindings only from exact Contract facts and explicit governed binding declarations
- render exact target file bytes without LLM model AI interpretation or semantic invention
- compute exact per-file SHA-256 template and binding integrity bindings
- validate path template binding authority interface payload and hash closure before returning exact Instance Plan
non_responsibilities:
- write target repository files
- verify repository bytes after write
- claim Q.Gate PASS Q.Activation publication deployment or runtime ACTIVE
- choose business semantics providers ports policies secrets or Capability Instance identity not explicitly governed
- invent paths templates bindings target files or Q-wide fields
- act as Q.Prompt or invoke any LLM model or AI in steady-state execution
capability_model:
  purpose: deterministically compile governed Contract template and binding inputs into an exact repository Instance Plan
  execution_mode: STEADY_STATE_NON_AI
  public_external_surface: false
  same_domain_only: true
  facade_owned_by: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/build_instance_plan
  entry_operation_id: build_instance_plan
  result_role: EXACT_INSTANCE_PLAN
