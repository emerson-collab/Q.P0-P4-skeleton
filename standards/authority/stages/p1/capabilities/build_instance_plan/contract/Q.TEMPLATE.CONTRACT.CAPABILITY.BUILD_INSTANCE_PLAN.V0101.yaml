  existing_facade_operation_identity_preserved: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/build_instance_plan
  materialize_repository_semantics_changed: false
  verify_instance_semantics_changed: false
  compile_contract_semantics_changed: false
  facade_implementation_change_required: true
  owner_domain_composition_successor_required: true
  caller_capability_successor_required: true
forbidden:
- new P5 or alternative Stage creation
- target Stage generator Capabilities that duplicate P0 P1 P2 P3 P4 ownership
- final target file content supplied as opaque caller-authored generation result
- AI LLM model or Q.Prompt invocation in steady-state plan compilation
- semantic inference from prose when exact Contract field or governed binding is absent
- template selection by newest file numeric-highest version or filesystem order
- path inference outside Contract and selected Stage physical authority
- direct target repository writes from this Capability
- direct handler chaining between Operations
- owner-local payload schema used to expand Q-wide field catalog
- instance-local payload grammar extension
- Q.Gate verdict activation publication deployment or runtime ACTIVE claim
acceptance:
- build_instance_plan remains one Q.Template P1 Capability and does not create a new Stage
- Domain parent and caller Capability resolve this child only through stable CURRENT identity
- entry build_instance_plan Operation delegates internally through standard P1 internal-call interfaces
- all six deterministic suboperations execute in declared order through standard interface envelopes
- nonstandard internal payloads are allowed only as owner-local schemas within Payload Schema Boundary and Field Dictionary
  constraints
- caller no longer preconstructs final target repository file bytes
- every target file derives only from exact governed template bytes exact governed bindings and selected authority
- exact Instance Plan contains final bytes and hashes before materialize_repository
- identical replay identity inputs produce byte-identical Instance Plans
- any unresolved authority path template binding interface token or hash condition fails closed without AI fallback
- no Q.Gate PASS activation publication deployment or runtime ACTIVE status is implied
interfaces:
  build_instance_plan_invoke:
    surface: CALL
    kind: CALL_INVOKE
    method_ref: build_instance_plan
    path:
    - request_id
    - trace_id
    static_mount:
    - operation_contract
    dynamic_mount:
    - runtime_context
    - outcome_type
    - runtime_result
    - stable_error
    request_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/contracts/build_instance_plan_request_contract
    response_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/contracts/build_instance_plan_response_contract
    stable_error_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/stable_error_contract
