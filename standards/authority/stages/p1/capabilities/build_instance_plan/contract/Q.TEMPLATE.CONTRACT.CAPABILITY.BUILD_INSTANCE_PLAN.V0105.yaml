  field_dictionary_authority_ref: Q.SS.STD.META.CONTRACT.FIELD_DICTIONARY@${CURRENT}
  payload_schema_boundary_ref: Q.SS.STD.META.CONTRACT.PAYLOAD_SCHEMA_BOUNDARY@${CURRENT}
  surface_layer_mount_ref: Q.SS.STD.META.CONTRACT.SURFACE_LAYER_MOUNT@${CURRENT}
  dimension_interface_classification_ref: Q.SS.STD.META.CONTRACT.DIMENSION_INTERFACE_CLASSIFICATION@${CURRENT}
  connection_mode_ref: Q.SS.STD.META.CONTRACT.CONNECTION_MODE@${CURRENT}
  p1_internal_call_interface_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/interfaces/internal_call_invoke
  interface_layers:
