responsibilities:
- compile an exact deterministic repository projection plan from one compiled business Contract without requiring caller-preassembled authority
  template or binding sets
- resolve the exact applicable Meta and P0-P4 authority snapshot only through the predeclared P1 dependency slot realized by P2.Consumer or through
  an exact governed legacy input
- resolve exact physical file manifest only from Contract-declared physical semantics and selected Stage physical authorities
- resolve one exact governed template for every renderable file role from Q.Template-owned governed template authority
- resolve all template bindings first from exact Contract facts and then from governed binding declarations in the exact activated Contract closure
  without inferred defaults
- render exact target file bytes without LLM model AI interpretation or semantic invention
- compute exact per-file SHA-256 template and binding integrity bindings
- validate path template binding authority interface payload and hash closure before returning exact Instance Plan
non_responsibilities:
- write target repository files
- verify repository bytes after write
- directly read Q.Standard another Domain P1 implementation database Drive repository or provider outside a governed Q connection path
- implement P2.Provider or P2.Consumer lifecycle inside this P1 Capability
- claim Q.Gate PASS Q.Activation publication deployment or runtime ACTIVE
- choose business semantics providers ports policies secrets or Capability Instance identity not explicitly governed
- invent paths templates bindings target files or Q-wide fields
- act as Q.Prompt or invoke any LLM model or AI in steady-state execution
capability_model:
  purpose: deterministically compile one governed compiled business Contract into an exact repository Instance Plan while internally resolving
    governed authority template and binding inputs
  execution_mode: STEADY_STATE_NON_AI
  public_external_surface: false
  same_domain_only: true
  facade_owned_by: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/build_instance_plan
  entry_operation_id: build_instance_plan
  result_role: EXACT_INSTANCE_PLAN
  caller_preassembly_required: false
