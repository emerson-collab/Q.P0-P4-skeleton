operations:
  compile_contract:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/compile_contract
    semantic_role: DETERMINISTIC_CONTRACT_COMPILATION
    input_authority: EXACT_INPUT_CONTRACT
    requirements:
    - preserve exact input Contract as business semantic authority
    - compile only machine-readable Contract semantics
    - perform no LLM model AI interpretation semantic completion or invention
    - fail closed on unresolved ambiguous unsupported or integrity-invalid input
    output_role: COMPILED_CONTRACT_REPRESENTATION
  build_instance_plan:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/build_instance_plan
    semantic_role: DECOUPLED_DETERMINISTIC_INSTANCE_PLANNING_FACADE
    requires:
    - COMPILED_CONTRACT_REPRESENTATION
    - GOVERNED_CURRENT_LOCATOR_STATE
    - GOVERNED_TEMPLATE_AUTHORITY_SET
    - EXPLICIT_GOVERNED_BINDING_INPUTS
    delegates_to_capability_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}
    delegates_to_operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/operations/build_instance_plan
    delegates_to_interface_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.BUILD_INSTANCE_PLAN@${CURRENT}#/interfaces/build_instance_plan_invoke
    delegation_mode: P1_INTERNAL_CALL
    exact_target_ref_and_hash_resolved_before_call: true
    exact_target_version_or_hash_embedded: false
    output_role: EXACT_INSTANCE_PLAN
  materialize_repository:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/materialize_repository
    semantic_role: DETERMINISTIC_REPOSITORY_MATERIALIZATION
    requires:
    - EXACT_INSTANCE_PLAN
    requirements:
    - materialize only final bytes and hashes already frozen in the exact Instance Plan
    - preserve Contract Stage template and binding authority without reinterpretation
    - invoke no LLM model or AI
    - write hash delta only and fail closed on any planned hash mismatch
    output_role: MATERIALIZED_REPOSITORY
  verify_instance:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}#/operations/verify_instance
    semantic_role: FAIL_CLOSED_INSTANCE_VERIFICATION
    requires:
    - EXACT_INSTANCE_PLAN
    - MATERIALIZED_REPOSITORY
    requirements:
    - verify repository bytes and file set against exact Instance Plan
    - verify path binding template authority and integrity closure
    - fail closed on mismatch missing artifact unresolved authority or nondeterministic deviation
    - do not claim Q.Gate PASS Q.Activation publication or runtime ACTIVE
    output_role: VERIFICATION_REPORT
deterministic_instance_automation:
  execution_mode: STEADY_STATE_NON_AI
  chain_order:
  - compile_contract
  - build_instance_plan
  - materialize_repository
  - verify_instance
  build_instance_plan_is_facade_over_child_capability: true
  semantic_authority_preserved: true
  model_or_llm_required: false
  model_or_llm_call_inside_chain_forbidden: true
  q_prompt_artifact_required_for_steady_state_execution: false
  fail_closed_conditions:
  - exact input Contract identity or integrity cannot be resolved
  - governed CURRENT authority snapshot is incomplete or inconsistent
  - required template path variable or binding input is unresolved
  - child build_instance_plan exact authority or interface cannot be resolved
  - any step would require model inference or semantic invention
  - verification does not reproduce planned authority and integrity closure
