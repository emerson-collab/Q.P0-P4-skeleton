forbidden:
- exact owner Domain Contract version or content-hash pin
- exact build_instance_plan child version or content-hash pin
- direct handler import or custom internal HTTP/API bypass
- caller-supplied final target file content as substitute for child plan compilation
- LLM model AI interpretation inside steady-state chain
- business-semantic invention beyond exact input Contract
- Q.Prompt as mandatory steady-state runtime dependency
- silent fallback when authority template binding path or interface resolution is incomplete
- instance-local payload grammar extension
acceptance:
- owner Domain and child build_instance_plan resolve through stable CURRENT refs
- four external Domain Instantiation Operation identities remain unchanged
- build_instance_plan facade delegates only through P1 internal_call
- materialize_repository consumes exact plan final bytes without requiring caller-authored target files
- internal owner-local payload schemas remain standard-constrained and do not extend Q-wide fields
- same replay identity inputs produce byte-identical repository output
- no Gate PASS Activation publication deployment or runtime ACTIVE status is implied
