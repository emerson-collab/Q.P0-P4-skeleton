acceptance:
- CAPABILITY_IMPLEMENTATION_CONTRACT profile is complete and this Contract is the sole domain_instantiation Capability semantic authority
- 'exactly four Operations exist: compile_contract, build_instance_plan, materialize_repository, verify_instance'
- Domain -> Capability -> Operation is preserved and every Interface remains Operation-owned
- one exact governed Business Contract is the only target business semantic authority
- Instance Plan is derived and non-authoritative and may not create missing business semantics
- P0 V0134, P1 V0172, P2 V0112, P3 V0141 and P4 V0138 are the bound generation Stage baseline
- each Stage Pack is a logical precompiled projection of its exact bound Stage DRT, not a new repository directory
- the target repository root is materialized directly as the exact set union of the five bound Stage DRT projections plus only the exact input
  Business Contract DRT overlay
- standard-determined content is precompiled or deterministically projected before variable substitution
- Q-wide Interface fields remain within the current 103-field dictionary and owner-local payload grammar remains local
- P2 remains one Stage with Provider/Consumer roles; P2A/P2B Stage identities are forbidden
- target database ownership remains target-Domain-owned
- generated path closure, unresolved-variable closure, reference/hash closure and forbidden-path closure are verified
- verification output and generation receipts are non-decisional and never act as Q.Gate or Activation authority
- no stage-local .github/workflows/*verify*.yml launcher is materialized; target verification execution is routed through Q.Workflow workflow_execution_invoke
  while Stage-owned tests/evidence remain Stage-owned
- Q.Workflow execution success is delivery/execution evidence only and never acts as Q.Gate PASS
- same-Domain Operation-to-Operation semantic calls use P1 internal_call_invoke; direct handler import, internal HTTP and a custom internal API
  are forbidden as semantic connection authority
- an internal interface package, if physically packaged, is only an implementation projection of the existing P1 internal_call_invoke Interface
  and is not a new Q object, hierarchy level, Surface, Kind or field catalog
- each domain_instantiation Operation source is generated only at src/p1/domain_instantiation/<operation_id>/handler.ts and its required test
  only at tests/p1/domain_instantiation/<operation_id>/handler.test.ts
- no executable Q.Template parent-Domain business handler root is created; executable business code remains Capability/Operation-owned
