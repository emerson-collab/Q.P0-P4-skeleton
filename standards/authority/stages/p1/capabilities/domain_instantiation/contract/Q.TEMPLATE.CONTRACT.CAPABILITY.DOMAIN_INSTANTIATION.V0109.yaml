operations:
  compile_contract:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0109#/operations/compile_contract
    owner_capability_ref: Q.TEMPLATE.CAPABILITY.DOMAIN_INSTANTIATION@V0109
    semantic_role: DETERMINISTIC_CONTRACT_COMPILATION
    input_authority: EXACT_INPUT_CONTRACT
    requirements:
      - preserve the exact input Contract as business semantic authority
      - compile only Contract-declared machine-readable semantics into a deterministic compiled representation
      - perform no LLM, model, AI interpretation, semantic completion, or business-semantic invention
      - fail closed when required semantics are unresolved, ambiguous, unsupported, or integrity-invalid
    output_role: COMPILED_CONTRACT_REPRESENTATION
  build_instance_plan:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0109#/operations/build_instance_plan
    owner_capability_ref: Q.TEMPLATE.CAPABILITY.DOMAIN_INSTANTIATION@V0109
    semantic_role: DETERMINISTIC_INSTANCE_PLANNING
    requires:
      - COMPILED_CONTRACT_REPRESENTATION
      - EXACT_GOVERNED_CURRENT_AUTHORITY_SNAPSHOT
    requirements:
      - derive the exact repository materialization plan from the compiled Contract and governed CURRENT authorities
      - bind exact target paths, governed template selections, and declared variable or binding values needed for materialization
      - infer no business semantics, repository paths, template identities, or undeclared bindings
      - fail closed when any required plan element cannot be deterministically resolved
    output_role: EXACT_INSTANCE_PLAN
  materialize_repository:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0109#/operations/materialize_repository
    owner_capability_ref: Q.TEMPLATE.CAPABILITY.DOMAIN_INSTANTIATION@V0109
    semantic_role: DETERMINISTIC_REPOSITORY_MATERIALIZATION
    requires:
      - EXACT_INSTANCE_PLAN
      - GOVERNED_TEMPLATE_AND_BINDING_INPUTS
    requirements:
      - materialize repository files only from the exact instance plan and governed template or binding inputs
      - preserve Contract and Stage authority without reinterpretation
      - invoke no LLM, model, or AI in steady-state instance materialization
      - produce deterministic repository bytes for identical exact inputs and authority snapshots
      - fail closed rather than substitute, infer, or improvise missing generation material
    output_role: MATERIALIZED_REPOSITORY
  verify_instance:
    operation_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0109#/operations/verify_instance
    owner_capability_ref: Q.TEMPLATE.CAPABILITY.DOMAIN_INSTANTIATION@V0109
    semantic_role: FAIL_CLOSED_INSTANCE_VERIFICATION
    requires:
      - EXACT_INSTANCE_PLAN
      - MATERIALIZED_REPOSITORY
    requirements:
      - verify repository output against the exact instance plan and resolved Contract and Stage authorities
      - verify declared path, binding, integrity, and authority closure before accepting the instance result
      - fail closed on any mismatch, missing artifact, unresolved authority, or nondeterministic deviation
      - do not claim Q.Gate PASS, Q.Activation, publication, or runtime ACTIVE

deterministic_instance_automation:
  execution_mode: STEADY_STATE_NON_AI
  chain_order:
    - compile_contract
    - build_instance_plan
    - materialize_repository
    - verify_instance
  semantic_authority_preserved: true
  model_or_llm_required: false
  model_or_llm_call_inside_chain_forbidden: true
  q_prompt_artifact_required_for_steady_state_execution: false
  bootstrap_or_evolution_code_authoring_is_runtime_dependency: false
  q_prompt_boundary: Q.Prompt may support bootstrap or evolution code-generation workflows, but is not a mandatory runtime dependency of steady-state domain instantiation
  deterministic_replay_identity:
    inputs:
      - exact_input_contract_ref_hash_and_content
      - exact_governed_current_authority_snapshot
      - q_template_capability_version
      - governed_template_and_binding_input_hashes
    invariant: identical replay identity inputs produce the same exact instance plan and materialized repository bytes
  fail_closed_conditions:
    - exact input Contract identity or integrity cannot be resolved
    - governed CURRENT authority snapshot is incomplete or inconsistent
    - required template, path, variable, or binding input is unresolved
    - any step would require model inference or semantic invention to continue
    - verification does not reproduce the planned authority and integrity closure

operation_semantic_change_boundary:
  predecessor: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0108
  operation_identities_changed: false
  operation_business_semantics_changed: true
  interface_semantics_changed: false
  change_scope:
    - preserve the four existing Operation identities and their fixed execution order
    - define compile_contract as deterministic Contract-to-machine-compilable semantic compilation with no AI interpretation
    - define build_instance_plan as deterministic resolution of paths, templates, variables, bindings, and governed CURRENT authority inputs
    - define materialize_repository as deterministic non-AI repository byte materialization from the exact instance plan
    - define verify_instance as fail-closed verification of plan, authority, path, binding, and integrity closure
    - make Q.Prompt or an LLM non-required for steady-state instance materialization while leaving bootstrap or evolution code-authoring outside this runtime chain

