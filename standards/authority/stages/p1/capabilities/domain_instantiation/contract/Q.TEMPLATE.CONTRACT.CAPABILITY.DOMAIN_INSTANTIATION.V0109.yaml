forbidden:
  - exact owner Domain Contract version pin
  - exact owner Domain Contract content hash pin
  - parent Domain semantic duplication inside the Capability Contract
  - direct handler import or custom internal HTTP/API bypass
  - inferred P1 source or test paths
  - LLM, model, or AI interpretation inside the steady-state domain-instantiation execution chain
  - business-semantic invention beyond the exact input Contract
  - Q.Prompt as a mandatory steady-state runtime dependency of domain instantiation
  - silent fallback when compilation, planning, materialization, or verification inputs are incomplete

acceptance:
  - the Capability Contract has an independent version lineage from the parent Domain Contract
  - owner Domain resolution uses Q.TEMPLATE.CONTRACT.DOMAIN@${CURRENT} rather than a fixed parent version
  - the four existing Operation identities are preserved
  - steady-state execution order is compile_contract then build_instance_plan then materialize_repository then verify_instance
  - steady-state instance materialization requires no LLM, model, AI, or Q.Prompt Artifact
  - identical replay identity inputs deterministically produce the same exact instance plan and repository bytes
  - unresolved semantic, authority, template, binding, path, integrity, or verification inputs fail closed rather than invoke inference
  - parent Q.Template Domain Contract remains independently versioned and does not require a successor for this child semantic evolution
  - P1 physical placement follows V0174 concrete Capability projection
  - P2, P3, and P4 remain aligned to V0114, V0144, and V0140 respectively
  - no Gate PASS or runtime Activation claim is implied by this Contract
