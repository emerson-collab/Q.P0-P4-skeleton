role_capability_catalog:
  provider:
    exact_capability_count: 2
    capabilities:
      capability_publishing:
        purpose: materialize and publish immutable PUBLICATION_ELIGIBLE P1 capability material without changing provider-owned P1 semantics
        owns:
          - material_set
          - publication_artifact
          - dependency_closure
          - provider_lineage
          - publication_facts
        does_not_own:
          - consumer_mount
          - consumer_binding
          - consumer_active_pointer
          - provider_business_runtime
        exact_capability_contract_required: true
        capability_contract_standard_ref: Q.SS.STD.META.CONTRACT.CAPABILITY_CONTRACT@${CURRENT}
      governed_data_exposure:
        purpose: sole governed non-change outward exposure of source-owned facts for authorized cross-domain consumers
        data_categories:
          - STATIC
          - DYNAMIC
          - RUNTIME
        data_category_semantics:
          STATIC: exact source identity/revision and P1-authorized static/package facts
          DYNAMIC: current governed source-owned state exposed only through declared Q Interfaces or authorized governed state/registry facts
          RUNTIME: already-produced actual execution facts such as authorized ExecutionReceipt/rule_evidence/runtime facts; provider re-execution solely to manufacture data is 
            forbidden
        data_categories_are_local_taxonomy_not_meta_classification: true
        material_standard_ref: Q.SS.STD.META.CONTRACT.GOVERNED_DATA_MATERIAL@${CURRENT}
        large_or_opaque_body_externalized_by_default: true
        dynamic_snapshot_requires_fixed_source_revision: true
  consumer:
    exact_capability_count: 3
    capabilities:
      external_capability_mounting:
        purpose: consume verified provider publication, resolve implementation material, create/activate/rollback Binding/Mount and invoke exact published Q Interface
        resolver_owner: P2.Consumer
      governed_data_consumption:
        purpose: sole governed inward consumption of Provider-exposed STATIC/DYNAMIC/RUNTIME data
        preserves:
          - source_domain_identity
          - subject_identity
          - data_category
          - source_provenance
          - source_fact_authority
          - governed_access_binding
          - integrity_binding
        does_not_create:
          - Evidence
          - Observation
          - RuleResult
          - GateResult
          - receiving_P1_business_semantics
      p1_dependency_realization:
        purpose: bind an active external capability mount or governed-data consumption binding to an already-declared receiving-P1 local_dependency_ref and exact receiving 
          Operation use
        p1_dependency_creation_forbidden: true
        provider_capability_reownership_forbidden: true
