q_header: '1'
q_id: Q.SS.STD.P3.CONTRACT.EVOLUTION
q_version: V0144
q_title: P3 Business Evolution Plane — Domain, Capability and Operation Contract Evolution
q_stage: P3
q_role: domain_evolution
q_status: active
q_refs:
  supersedes:
    - Q.SS.STD.P3.CONTRACT.EVOLUTION@V0143
  pair: Q.SS.STD.P3.DESC.EVOLUTION@V0144
  contract:
  drt: Q.SS.STD.P3.DRT.EVOLUTION@V0144
  depends_on:
    - Q.SS.STD.META.CONTRACT.ARTIFACT@${CURRENT}
    - Q.SS.STD.META.CONTRACT.CONTRACT@${CURRENT}
    - Q.SS.STD.META.CONTRACT.DIMENSION_INTERFACE_CLASSIFICATION@${CURRENT}
    - Q.SS.STD.META.CONTRACT.SURFACE_LAYER_MOUNT@${CURRENT}
    - Q.SS.STD.META.CONTRACT.SYSTEM_OBJECT_NAMING.MIN@${CURRENT}
    - Q.SS.STD.META.CONTRACT.STAGE_ARTIFACT_FILE_NAMING@${CURRENT}
    - Q.SS.STD.META.CONTRACT.REPOSITORY_DIRECTORY_SKELETON@${CURRENT}
    - Q.SS.STD.META.CONTRACT.FIELD_DICTIONARY@${CURRENT}
    - Q.SS.STD.P0.CONTRACT.RUNTIME_CORE@${CURRENT}
    - Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}
    - Q.SS.STD.P2.CONTRACT.CROSS_DOMAIN_REALIZATION@${CURRENT}
    - Q.SS.STD.META.CONTRACT.DATABASE_PERSISTENCE@${CURRENT}
    - Q.SS.STD.META.CONTRACT.DATABASE_TOPOLOGY@${CURRENT}
    - Q.SS.STD.META.CONTRACT.CAPABILITY_CONTRACT@${CURRENT}
  desc: Q.SS.STD.P3.DESC.EVOLUTION@V0144
artifact_scope:
  profile: implementation_specification_standard
  normative_unit:
    - DESC
    - CONTRACT
    - DRT
  readiness: active_current_source
  claims_implementation_exists: false
  runtime_evidence_required: false
  deployment_required: false
  tree_required: true
  tree_source: physical_model
  production_runtime_claim_forbidden_without_evidence: true
  latest_source_is_current_and_active: true
schema: q.ss.p3.evolution.contract.v12
authority:
  contract_is_machine_source_of_truth: true
  desc_is_non_authoritative_projection: true
  drt_is_non_authoritative_projection: true
  contract_rule_set_is_importable_authority: true
  drt_rule_set_is_drt_artifact_projection_authority: true
  hand_written_parallel_authority_forbidden: true
  local_upstream_semantic_redefinition_forbidden: true
  fail_closed_on_missing_or_ambiguous_authority: true
  current_selection_authority: Q_STANDARD_SELECTED_ACTIVE_POINTER
  database_projection_is_not_current_selection_authority: true
  gate_verdict_is_not_current_selection_authority: true
  capability_contract_standard_ref: Q.SS.STD.META.CONTRACT.CAPABILITY_CONTRACT@${CURRENT}
  current_contract_is_self_contained: true
  predecessor_is_lineage_only_not_current_semantic_source: true
release_change_boundary:
  predecessor: Q.SS.STD.P3.CONTRACT.EVOLUTION@V0143
  change_kind: business_evolution_plane_capability_operation_scope_and_contract_class_routing
  update_classification: INCOMPATIBLE
  semantic_reduction_forbidden: true
  business_semantics_redefined: false
  implementation_activation_implied: false
  governance_transition_implied: false
  business_domain_capability_operation_evolution_owned_by_p3: true
  business_multi_domain_execution_removed_from_p4: true
  standard_skeleton_root_routes_to_p4: true
  implementation_only_change_excluded_from_evolution_root: true
inheritance_boundary:
  dependency_direction: P0 -> P1 -> P2 -> P3 -> P4
  imported_semantics:
    P0:
      ref: Q.SS.STD.P0.CONTRACT.RUNTIME_CORE@${CURRENT}
      role: only_runtime_provider
    P1:
      ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}
      role: business_and_capability_semantic_owner
    P2:
      ref: Q.SS.STD.P2.CONTRACT.CROSS_DOMAIN_REALIZATION@${CURRENT}
      role: provider_publication_fact_and_consumer_mount_fact_owner
  import_mode: exact_versioned_reference
  copy_restate_override_or_widen_forbidden: true
  conflict_resolution: fail_closed
  direct_runtime_consumption_of_p1_p2a_p2b: false
  accepted_p2_facts:
    - P2.Provider Publication Fact
    - P2.Consumer Mount Fact
  reverse_dependency_forbidden: true
  unversioned_or_undeclared_dependency_forbidden: true
  direct_runtime_consumption_of_p1_or_p2: false
stage:
  stage_id: P3
  stage_name: SELF_EVOLUTION
  scope: one_business_domain_per_execution
  decisive_authority: transition_one_complete_governed_business_domain_state_for_domain_capability_or_operation_contract_change
  self_evolving: true
  self_authorizing: false
  domain_write_owner: P3
  runtime_model: local_p0_runtime_only
  separate_runtime_forbidden: true
  cross_domain_write_or_transaction_forbidden: true
  multi_domain_or_shared_scope_routes_to: P4_ONLY_FOR_STANDARD_OR_SKELETON_CONTRACT_ROOT
  shared_scope_kinds:
    - META_STANDARD_CONTRACT
    - STAGE_STANDARD_CONTRACT
  stage_role: NONE
  business_cross_domain_change_propagates_via: P2
  business_cross_domain_execution_model: INDEPENDENT_P3_PER_AFFECTED_DOMAIN
  implementation_change_without_contract_change_is_not_evolution: true
semantic_kernel:
  change_authority:
    accepted:
      - accepted_evolution_case
      - governed_manual_change_case
    rejected:
      - raw_observation
      - metric_or_log
      - unverified_model_recommendation
      - inferred_dependency
      - partial_patch
    root_event: EXACT_CONTRACT_TRANSITION_ONLY
    required_contract_transition_semantics:
      - stable_contract_q_id
      - previous_exact_contract_ref
      - previous_contract_hash
      - current_exact_contract_ref
      - current_contract_hash
    implementation_only_change_without_contract_transition_rejected: true
  evolution_case:
    immutable_hash_bound: true
    required_semantics:
      - objective
      - problem_statement
      - reason
      - target_object_refs
      - expected_effects
      - success_metrics
      - risk
      - proposal_source
      - evidence_set
      - predicted_impact_graph_ref
    semantic_revision_requires_new_reference: true
  evidence:
    source_ownership_preserved: true
    stored_as_versioned_reference_only: true
    required_semantics:
      - content_hash
      - lineage
      - time_window
      - declared_usage
    mutable_or_unhashed_evidence_rejected: true
  impact_graph:
    predicted_required_before_candidate: true
    verified_required_before_activation: true
    verified_graph_recomputed_from_complete_candidate: true
    ai_inferred_edges_are_hypotheses: false
    unresolved_or_expanded_scope_blocks_activation: true
    ai_inferred_edges_forbidden: true
    hash_delta_and_governed_dependency_facts_only: true
  candidate_domain_state:
    complete_state_not_patch: true
    component_kinds_closed:
      - BUSINESS_OBJECT
      - ITEM
      - FIELD
      - SCHEMA
      - INTERFACE
      - CONTRACT
      - POLICY
      - CONFIGURATION
      - IMPLEMENTATION
      - PUBLICATION
      - DEPENDENCY
      - DATA
      - DEPLOYMENT
      - SECURITY_CONTROL
    applicable_component_required_semantics:
      - kind
      - versioned_ref
      - content_hash
      - owner_ref
      - compatibility_status
      - owner_preparation_receipt_ref
    non_applicable_kind_requires_reason: true
    p3_composes_and_verifies_but_does_not_absorb_owner_authority: true
    capability_contract_composition_required: true
    capability_contract_map_entry_required:
      - capability_ref
      - capability_contract_ref
      - capability_contract_content_hash
      - compatibility_status
    moving_current_alias_inside_activated_domain_state_forbidden: true
lifecycle:
  formal_operations:
    - inspect_change
    - create_candidate
    - validate_candidate
    - approve_candidate
    - activate_candidate
    - evaluate_candidate
    - rollback_candidate
    - read_receipt
  states:
    - OBSERVED
    - PROPOSED
    - CANDIDATE_CREATED
    - VALIDATED
    - APPROVED
    - WAITING_FOR_P4
    - TRIAL_ACTIVE
    - EFFECT_EVALUATED
    - ACTIVE
    - ROLLED_BACK
  transition_order:
    - OBSERVED -> PROPOSED
    - PROPOSED -> CANDIDATE_CREATED
    - CANDIDATE_CREATED -> VALIDATED
    - VALIDATED -> APPROVED | WAITING_FOR_P4
    - APPROVED | WAITING_FOR_P4 -> TRIAL_ACTIVE | ACTIVE
    - TRIAL_ACTIVE -> EFFECT_EVALUATED
    - EFFECT_EVALUATED -> ACTIVE | ROLLED_BACK | CANDIDATE_CREATED | WAITING_FOR_P4
  outcomes:
    - RETAIN
    - ADJUST
    - ROLLBACK
    - ESCALATE
  invariants:
    direct_activation_only_when_trial_not_required: true
    trial_pointer_separate_from_active_pointer: true
    active_pointer_unchanged_during_trial: true
    pointer_mutation_uses_cas: true
    mutation_guarded_idempotent_atomic_and_receipted: true
    adjust_creates_new_candidate_lineage: true
    irreversible_migration_requires_forward_recovery_plan: true
    active_is_stable_non_terminal: true
    rolled_back_is_terminal: true
    validation_precedes_approval: true
    active_state_exact_capability_contract_refs_and_hashes_required: true
    capability_pass_does_not_replace_domain_composition_validation: true
object_model:
  hierarchy:
    - DOMAIN
    - CAPABILITY
    - OPERATION
  domain_ref: q.p3.domain.domain_evolution
  capability_ref: q.p3.capability.governed_evolution
  operation_ids:
    - inspect_change
    - create_candidate
    - validate_candidate
    - approve_candidate
    - activate_candidate
    - evaluate_candidate
    - rollback_candidate
    - read_receipt
  coordination_port_ref: q.p3.port.coordination_contract
  module_object_forbidden: true
  local_parent_identity_must_resolve: true
  interface_is_operation_owned_formal_object_not_hierarchy_level: true
  port_is_binding_object_not_business_hierarchy_level: true
interface_contract:
  classification:
    stage: B4/P3
    role: N1/NONE
    active_surfaces:
      - CALL
    not_applicable_surfaces:
      - HOOK
      - EVENT
      - REGISTRY
    active_interface_kinds:
      - CALL_INVOKE
    not_applicable_interface_kinds:
      - HOOK_BIND
      - HOOK_EVALUATE
      - EVENT_PUBLISH
      - EVENT_CONSUME
      - REGISTRY_REGISTER
      - REGISTRY_RESOLVE
      - REGISTRY_LOOKUP
      - REGISTRY_WATCH
  layers:
    exact:
      - PATH
      - STATIC_MOUNT
      - DYNAMIC_MOUNT
    closed_disjoint: true
    PATH: routing_identity_and_correlation_only
    STATIC_MOUNT: versioned_contract_policy_state_cas_lease_fencing_idempotency_persistence_trust_and_verification
    DYNAMIC_MOUNT: request_execution_fact_response_evidence_outcome_and_stable_error
    inferred_omitted_duplicate_or_unclassified_field_forbidden: true
  call_result:
    exactly_one_of:
      - Response
      - StableError
    explicit_outcome_type_required: true
    stable_error_wire_fields:
      - code
      - message
      - category
      - retriable
      - trace_id
      - request_id
    validation_or_approval_rejection_is_stable_error: true
    governed_evaluation_decision_is_success_result: true
  common_fields:
    mutation_request_required:
      - idempotency_key
      - trace_id
      - request_id
    mutation_response_required:
      - receipt_ref
      - trace_id
      - request_id
    read_request_required:
      - trace_id
      - request_id
    read_response_required:
      - trace_id
      - request_id
  idempotency:
    canonical_request_hash_required: true
    same_key_same_request_same_result: true
    same_key_different_request_rejected: true
    max_effective_executions_per_key: 1
  operations:
    inspect_change:
      request_required:
        - domain_ref
        - change_ref
      request_forbidden:
        - raw_observation
        - unverified_ai_recommendation
      response_required:
        - inspection_ref
        - evolution_case_ref
        - predicted_impact_graph_ref
        - routing_decision
      stable_errors:
        - P3_CHANGE_NOT_FOUND
        - P3_CHANGE_AUTHORITY_INVALID
        - P3_EVOLUTION_EVIDENCE_INVALID
        - P3_IMPACT_GRAPH_INVALID
        - P3_INSPECTION_FAILED
    create_candidate:
      request_required:
        - domain_ref
        - change_ref
        - inspection_ref
        - predicted_impact_graph_ref
        - expected_active_version
      request_forbidden:
        - partial_patch_ref
      response_required:
        - candidate_ref
        - candidate_hash
        - domain_state_ref
      stable_errors:
        - P3_CHANGE_INVALID
        - P3_INSPECTION_REQUIRED
        - P3_DOMAIN_STATE_INCOMPLETE
        - P3_CANDIDATE_CONFLICT
        - P3_CANDIDATE_CREATE_FAILED
      cas_required: true
    validate_candidate:
      request_required:
        - domain_ref
        - candidate_ref
        - candidate_hash
        - predicted_impact_graph_ref
      response_required:
        - validation_ref
        - validation_status
        - verified_impact_graph_ref
      stable_errors:
        - P3_CANDIDATE_NOT_FOUND
        - P3_CANDIDATE_HASH_MISMATCH
        - P3_DOMAIN_STATE_INCOMPLETE
        - P3_OWNER_RECEIPT_INVALID
        - P3_IMPACT_SCOPE_EXPANDED
        - P3_VALIDATION_REJECTED
        - P3_VALIDATION_FAILED
    approve_candidate:
      request_required:
        - domain_ref
        - candidate_ref
        - validation_ref
        - verified_impact_graph_ref
        - approver_ref
        - approval_scope
      response_required:
        - approval_ref
        - approval_status
        - approval_scope
        - routing_decision
      stable_errors:
        - P3_VALIDATION_REQUIRED
        - P3_IMPACT_SCOPE_UNRESOLVED
        - P3_APPROVAL_SCOPE_INVALID
        - P3_APPROVAL_REJECTED
        - P3_APPROVAL_FAILED
    activate_candidate:
      request_required:
        - domain_ref
        - candidate_ref
        - approval_ref
        - expected_active_version
      request_optional:
        - activation_mode
        - trial_profile_ref
        - evaluation_ref
      response_required:
        - active_pointer_ref
        - active_version
      response_optional:
        - trial_pointer_ref
      stable_errors:
        - P3_APPROVAL_REQUIRED
        - P3_TRIAL_POLICY_REQUIRED
        - P3_EVALUATION_REQUIRED
        - P3_COMPONENT_PREPARATION_INCOMPLETE
        - P3_ACTIVE_VERSION_CONFLICT
        - P3_ACTIVATION_FAILED
      cas_required: true
    evaluate_candidate:
      request_required:
        - domain_ref
        - candidate_ref
        - trial_pointer_ref
        - evaluation_profile_ref
        - outcome_evidence_ref
      response_required:
        - evaluation_ref
        - evaluation_result
      stable_errors:
        - P3_TRIAL_NOT_ACTIVE
        - P3_OUTCOME_EVIDENCE_INVALID
        - P3_EVALUATION_PROFILE_INVALID
        - P3_EVALUATION_FAILED
    rollback_candidate:
      request_required:
        - domain_ref
        - active_pointer_ref
        - rollback_target_ref
        - expected_active_version
      request_optional:
        - trial_pointer_ref
        - rollback_scope
      response_required:
        - active_pointer_ref
        - active_version
      response_optional:
        - trial_pointer_ref
      stable_errors:
        - P3_ROLLBACK_TARGET_INVALID
        - P3_IRREVERSIBLE_MIGRATION_UNRECOVERABLE
        - P3_ACTIVE_VERSION_CONFLICT
        - P3_ROLLBACK_FAILED
      cas_required: true
    read_receipt:
      request_required:
        - domain_ref
        - receipt_ref
      request_forbidden:
        - p4_authorization_receipt_ref
        - idempotency_key
      response_required:
        - receipt
        - receipt_hash
      stable_errors:
        - P3_RECEIPT_NOT_FOUND
        - P3_RECEIPT_INVALID
      read_only: true
  coordination_port:
    closed: true
    method_names_exact:
      - request_candidate
      - request_activation
      - request_rollback
      - read_receipt
    fifth_method_forbidden: true
    ownership:
      contract: P3
      provider: P3
      client: P4
      binding: P4
    contract_file: src/p3/coordination_port_contract.ts
    provider_file: src/p3/coordination_port_provider.ts
    downstream_provider_import_forbidden: true
    exact_port_parity_required: true
    methods:
      request_candidate:
        request_required:
          - change_set_ref
          - target_domain_ref
          - change_ref
          - expected_active_version
          - lease_epoch
          - fencing_token
          - idempotency_key
          - trace_id
          - request_id
        request_optional:
          - predicted_impact_graph_ref
        request_forbidden:
          - p4_authorization_receipt_ref
          - activation_plan_ref
          - approval_ref
        response_required:
          - candidate_ref
          - candidate_hash
          - receipt_ref
          - trace_id
          - request_id
        response_optional:
          - domain_state_ref
        stable_errors:
          - P3_COORDINATION_REQUEST_INVALID
          - P3_CHANGE_AUTHORITY_INVALID
          - P3_IMPACT_GRAPH_INVALID
          - P3_LEASE_INVALID
          - P3_FENCING_REJECTED
          - P3_CANDIDATE_CONFLICT
          - P3_CANDIDATE_CREATE_FAILED
        authorization: forbidden
        cas_required: true
      request_activation:
        request_required:
          - change_set_ref
          - activation_plan_ref
          - target_domain_ref
          - target_step_ref
          - candidate_ref
          - approval_ref
          - expected_active_version
          - p4_authorization_receipt_ref
          - lease_epoch
          - fencing_token
          - idempotency_key
          - trace_id
          - request_id
        request_optional:
          - activation_mode
          - trial_profile_ref
          - evaluation_ref
        response_required:
          - active_pointer_ref
          - active_version
          - receipt_ref
          - trace_id
          - request_id
        response_optional:
          - trial_pointer_ref
        stable_errors:
          - P3_COORDINATION_REQUEST_INVALID
          - P3_AUTHORIZATION_INVALID
          - P3_AUTHORIZATION_EXPIRED
          - P3_AUTHORIZATION_REPLAYED
          - P3_TRUST_ANCHOR_INVALID
          - P3_TRIAL_POLICY_REQUIRED
          - P3_EVALUATION_REQUIRED
          - P3_COMPONENT_PREPARATION_INCOMPLETE
          - P3_LEASE_INVALID
          - P3_FENCING_REJECTED
          - P3_ACTIVATION_CONFLICT
          - P3_ACTIVATION_FAILED
        authorization: required_single_use
        cas_required: true
      request_rollback:
        request_required:
          - change_set_ref
          - activation_plan_ref
          - target_domain_ref
          - target_step_ref
          - active_pointer_ref
          - rollback_target_ref
          - expected_active_version
          - p4_authorization_receipt_ref
          - lease_epoch
          - fencing_token
          - idempotency_key
          - trace_id
          - request_id
        request_optional:
          - trial_pointer_ref
          - rollback_scope
        response_required:
          - active_pointer_ref
          - active_version
          - receipt_ref
          - trace_id
          - request_id
        response_optional:
          - trial_pointer_ref
        stable_errors:
          - P3_COORDINATION_REQUEST_INVALID
          - P3_AUTHORIZATION_INVALID
          - P3_AUTHORIZATION_EXPIRED
          - P3_AUTHORIZATION_REPLAYED
          - P3_TRUST_ANCHOR_INVALID
          - P3_IRREVERSIBLE_MIGRATION_UNRECOVERABLE
          - P3_LEASE_INVALID
          - P3_FENCING_REJECTED
          - P3_ROLLBACK_CONFLICT
          - P3_ROLLBACK_FAILED
        authorization: required_single_use
        cas_required: true
      read_receipt:
        request_required:
          - domain_ref
          - receipt_ref
          - trace_id
          - request_id
        request_forbidden:
          - p4_authorization_receipt_ref
          - idempotency_key
        response_required:
          - receipt
          - receipt_hash
          - trace_id
          - request_id
        stable_errors:
          - P3_RECEIPT_NOT_FOUND
          - P3_RECEIPT_INVALID
        authorization: forbidden
        read_only: true
  registry_not_applicable_reason: P3 current declares no registry method; durable persistence is internal state, not a public Registry Interface.
coordination_authorization:
  required_for:
    - request_activation
    - request_rollback
  forbidden_for:
    - request_candidate
    - read_receipt
  issuer: P4
  verifier_and_consumer: P3
  single_use: true
  signature_profile:
    algorithm: ECDSA_P256_SHA256
    canonicalization: RFC8785_JCS
    encoding: base64url_without_padding
  binds:
    - method
    - change_set
    - activation_plan
    - domain
    - step
    - expected_version
    - lease_epoch
    - fencing_token
    - exact_semantic_request_hash
    - key_id
    - key_version
    - revocation_epoch
    - issued_at
    - expires_at
    - nonce
    - method_specific_subject
  trust_boundary:
    p4_private_signing_key_handle_only: true
    p3_public_trust_anchor_and_revocation_state_only: true
    shared_symmetric_secret_forbidden: true
    downgrade_substitution_replay_or_reuse_forbidden: true
    verification_nonce_consumption_lease_fencing_and_domain_write_atomic: true
p2_fact_consumption:
  provider_publication_fact_contract: Q.SS.STD.P2.CONTRACT.CROSS_DOMAIN_REALIZATION@${CURRENT}#/provider_fact_contract
  consumer_mount_fact_contract: Q.SS.STD.P2.CONTRACT.CROSS_DOMAIN_REALIZATION@${CURRENT}#/consumer_fact_contract
  required_verification:
    - fact_identity
    - content_hash
    - source_contract
    - owner_ref
  semantic_reinterpretation_or_body_takeover_forbidden: true
persistence_and_receipts:
  production_store_properties:
    vendor_neutral: true
    restart_safe: true
    crash_safe: true
    in_memory_only_for_test_or_reference: true
  stores:
    - evolution_state
    - immutable_receipt
    - idempotency
    - lease_and_fencing
    - authorization_consumption
    - public_trust_anchor
  pointer_cas_required:
    - trial_pointer
    - active_pointer
  idempotency_contract:
    canonical_request_hash_required: true
    same_key_same_request_same_result: true
    same_key_different_request_rejected: true
    max_effective_executions_per_key: 1
  partial_commit_forbidden: true
  authorization_consumption_and_domain_write_atomic: true
  receipt:
    immutable: true
    hash_chained: true
    required_semantics:
      - trace_and_request_identity
      - canonical_request_hash
      - evolution_case_ref
      - evidence_refs
      - predicted_and_verified_impact_graph_refs_when_applicable
      - complete_domain_state_ref_and_hash
      - component_owner_receipt_refs
      - trial_and_evaluation_refs_when_used
      - previous_receipt_ref
      - primary_stable_error_identity_when_failed
  persistence_standard_ref: Q.SS.STD.META.CONTRACT.DATABASE_PERSISTENCE@${CURRENT}
  topology_standard_ref: Q.SS.STD.META.CONTRACT.DATABASE_TOPOLOGY@${CURRENT}
  database_is_not_semantic_authority: true
  live_database_catalog_is_observation_only: true
  cross_domain_direct_sql_business_dependency_forbidden: true
  cross_owner_foreign_key_business_dependency_forbidden: true
  artifact_result_evidence_receipt_body_externalization_follows_persistence_standard: true
  exact_persistence_contract_required_before_relational_materialization: true
