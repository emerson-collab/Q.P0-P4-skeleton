acceptance:
  - V0144 supersedes exactly V0143 under the governed manual change case; V0143 remains immutable lineage and registration alone does not imply Q.Gate PASS or Q.Activation.
  - P3 is the Business Evolution Plane for one Domain per execution, covering Domain/Capability/Operation Contract semantics; business changes affecting multiple Domains propagate 
    through P2 and execute as independent P3 transitions, while only Standard/Skeleton roots route to P4 execution.
  - All live upstream normative standard dependencies use stable Contract q_id @${CURRENT} and resolve to exact Contract refs before semantic use.
  - P3 consumes only governed P2 Provider Publication Fact and P2 Consumer Mount Fact and does not treat P2 as a runtime.
  - The P3 Coordination Port remains exactly four methods with Contract/Provider owned by P3 and Client/Binding owned by P4; request/response/StableError parity is preserved.
  - All active P3 Interfaces remain CALL/M1 with complete disjoint PATH, STATIC_MOUNT and DYNAMIC_MOUNT fields from the current Field Dictionary.
  - Persistence remains vendor-neutral, restart/crash safe and locally owned; database state is not semantic authority and cross-Domain SQL or cross-owner FK business coupling is 
    forbidden.
  - The candidate physical projection contains no local Gate script or parallel protocol-translation layer; Q.Gate remains external verdict authority and P3 contributes governed 
    Rules/Evidence only.
  - Contract and DRT RuleSets remain importable, stamped and exact to the successor Source; filesystem projection must match the successor physical model with zero undeclared 
    paths.
  - Stage-local GitHub verification workflow launcher is absent; Q.Workflow System Interface owns verification execution and Q.Gate remains final verdict authority.
