  rule_set_version: V0140
  rule_count: 7
  gate_decision_authority: false
  rules:
    P3-CAP-001:
      assertion: A capability semantic change produces an exact successor Capability Contract owned by the same Domain.
      rule_id: P3-CAP-001
      rule_version: V0139
    P3-CAP-002:
      assertion: Candidate remains one complete Domain State including exact refs/hashes for all changed and unchanged Capability Contracts.
      rule_id: P3-CAP-002
      rule_version: V0139
    P3-CAP-003:
      assertion: Activation rejects moving CURRENT aliases inside the composed active Domain State.
      rule_id: P3-CAP-003
      rule_version: V0139
    P3-CAP-004:
      assertion: Cross-capability dependency and compatibility closure validates before activation even when each Capability is individually valid.
      rule_id: P3-CAP-004
      rule_version: V0139
    P3-CAP-005:
      assertion: Multi-Domain business impact does not invoke P4 business-evolution execution; exact change/dependency facts propagate through P2 and each affected Domain executes 
        its own P3 transition, while cross-Domain write authority remains forbidden.
      rule_id: P3-CAP-005
      rule_version: V0140
    P3-CAP-006:
      assertion: Operation semantic change is governed as part of the owning Capability Contract successor and P3 may target only the affected Operation while composing one 
        complete candidate Domain State.
      rule_id: P3-CAP-006
      rule_version: V0140
    P3-CAP-007:
      assertion: Implementation-only changes that preserve all governed Contract semantics are outside the P3 evolution root and remain ordinary implementation/verification work.
