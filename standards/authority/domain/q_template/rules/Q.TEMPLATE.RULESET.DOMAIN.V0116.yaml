domain_rules:
  ruleset_ref: Q.TEMPLATE.RULESET.DOMAIN@V0116
  external_business_contract_required: true
  business_contract_is_only_business_semantic_authority: true
  business_semantic_inference_forbidden: true
  exact_current_source_only: true
  archived_source_semantics_forbidden: true
  exactly_one_domain_instantiation_capability_required: true
  exact_child_capability_contract_ref_and_hash_closure_required: true
  exact_four_child_operations_required:
  - compile_contract
  - build_instance_plan
  - materialize_repository
  - verify_instance
  domain_must_not_duplicate_capability_semantics: true
  all_applicable_meta_standards_must_resolve_before_materialization: true
  exact_p0_p4_stage_baseline_required: true
  standard_determined_content_must_be_precompiled_or_exactly_projected: true
  variable_slots_limited_to_identity_business_environment_dependency_bindings: true
  p0_single_runtime_required: true
  p1_hierarchy_domain_capability_operation_required: true
  interface_is_operation_owned_not_hierarchy_level: true
  module_forbidden: true
  p2_provider_consumer_role_model_required: true
  p2a_p2b_stage_identity_forbidden: true
  field_dictionary_count: 103
  q_wide_field_expansion_forbidden: true
  nested_business_payload_recursive_global_scan_forbidden: true
  target_database_ownership_stays_with_target_domain: true
  system_interface_must_overlay_exact_existing_capability_interface: true
  system_interface_cannot_create_surface_kind_or_layer: true
  missing_or_unlisted_generated_path_forbidden: true
  unresolved_variable_forbidden: true
  generated_hash_closure_required: true
  repository_skeleton_stage_projection_conflict_must_fail_closed_for_full_conformance: true
  generation_gate_decision_authority: false
  verification_gate_decision_authority: false
  activation_implied: false
  fail_closed_on_missing_authority_or_projection_mismatch: true
  stage_pack_is_logical_projection_not_repository_directory: true
  target_repository_root_is_exact_bound_stage_drt_union: true
  stage_packs_materialize_directly_to_target_repository_root: true
  stage_local_workflow_launcher_forbidden: true
  target_verification_execution_via_q_workflow_required: true
  q_workflow_execution_success_is_not_gate_pass: true
  exact_stage_contract_and_drt_hash_binding_required: true
  q_standard_current_resolution_required_for_live_standard_refs: true
  resolved_exact_contract_is_semantic_authority: true
  repository_skeleton_current_alignment_closed: true
  known_current_source_projection_conflict: false
  same_domain_runtime_calls_use_p1_internal_call_invoke: true
  p1_internal_call_interface_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/interfaces/internal_call_invoke
  connection_mode_authority_ref: Q.SS.STD.META.CONTRACT.CONNECTION_MODE@${CURRENT}
  direct_child_handler_import_for_semantic_call_forbidden: true
  internal_http_or_custom_internal_api_as_semantic_authority_forbidden: true
  internal_interface_package_is_only_implementation_projection_of_existing_p1_interface: true
  internal_interface_package_new_hierarchy_level_forbidden: true
  parent_domain_business_handler_root_forbidden: true
  concrete_capability_spec_source_test_directory_closure_required: true
receipt_rules:
  generation_receipts_are_non_decisional: true
  receipt_must_bind_input_contract_ref_and_hash: true
  receipt_must_bind_stage_baseline_refs: true
  receipt_must_bind_generated_file_hashes: true
  verification_material_must_bind_generated_file_hashes: true
  q_gate_remains_verdict_authority: true
