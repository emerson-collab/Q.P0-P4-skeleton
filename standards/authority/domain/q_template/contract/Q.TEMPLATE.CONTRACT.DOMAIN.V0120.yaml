forbidden:
- exact child Contract version pin embedded in parent composition
- child Contract content hash embedded in parent composition authority
- child Operation or Interface semantic duplication in parent Domain Contract
- direct handler import between child Capabilities
- custom internal HTTP or bypass API for same-Domain calls
- unstandardized Q-wide field invention from owner-local payload schemas
- P2A or P2B namespace creation
- local Gate or parallel verdict authority
- direct AI implementation mutation without an exact bound Q.Prompt Prompt Artifact
- GENERATION_LIFECYCLE used as ordinary current code-generation authority
acceptance:
- Domain and both child Capability Contracts keep independent version lineages
- child Capabilities resolve only through stable CURRENT references and exact runtime resolution
- Capability Instance and Binding field sets remain owned by current Meta standards
- same-Domain calls use the P1 internal-call interface and standard interface field model
- owner-local internal payload schemas are allowed only inside PAYLOAD_SCHEMA_BOUNDARY and FIELD_DICTIONARY constraints
- no child exact version or content hash is embedded in the Domain Contract
- no Gate PASS Activation publication deployment or runtime ACTIVE status is implied
- both child Capability composition entries are exact-versioned and carry exact content hashes
- Domain required semantic sections for the current DOMAIN_IMPLEMENTATION_CONTRACT profile are present
- ordinary Q.Template implementation generation is governed by PROMPT_STANDARD and exact Prompt Artifact provenance rather than GENERATION_LIFECYCLE
- P2 remains the sole realization owner for cross-Domain dependency slots declared by child P1 Capabilities
