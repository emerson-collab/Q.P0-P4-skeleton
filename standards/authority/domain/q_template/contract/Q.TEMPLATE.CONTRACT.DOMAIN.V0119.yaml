authority_resolution:
  live_reference_expression: <stable_contract_q_id>@${CURRENT}
  q_standard_is_locator_not_semantic_authority: true
  resolved_exact_contract_and_hash_required_before_semantic_use: true
  raw_newest_file_selection_forbidden: true
  numeric_highest_selection_forbidden: true
  database_max_selection_forbidden: true
responsibilities:
- own q_template Domain identity and Domain-wide Capability composition policy
- compose child Capabilities only by stable Contract identity and governed CURRENT resolution
- preserve parent-child version and content-hash decoupling while requiring exact resolved child authority before instantiation
- preserve Q.Template generation as deterministic non-decisional repository projection
- bind target P0-P4 generation to governed CURRENT Stage authorities without redefining Stage semantics
non_responsibilities:
- define or duplicate child Capability Operation semantics
- embed exact child versions or child content hashes as composition authority
- invent Capability Instance or Binding field sets owned by Meta standards
- create a second Runtime
- claim Q.Gate PASS Q.Activation publication deployment or runtime ACTIVE
capability_composition:
  domain_instantiation:
    capability_ref: Q.TEMPLATE.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}
    capability_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@${CURRENT}
    resolution_mode: GOVERNED_CURRENT_RESOLUTION
    resolved_exact_contract_and_hash_required: true
    parent_embeds_child_exact_version: false
    parent_embeds_child_content_hash: false
    child_semantic_definition_copied_into_parent: false
    child_private_implementation_change_requires_parent_contract_successor: false
  build_instance_plan:
