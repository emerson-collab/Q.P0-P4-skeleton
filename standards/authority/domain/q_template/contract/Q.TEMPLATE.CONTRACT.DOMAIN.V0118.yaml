authority_resolution:
  live_reference_expression: <stable_contract_q_id>@${CURRENT}
  q_standard_is_locator_not_semantic_authority: true
  resolved_exact_contract_and_hash_required_before_materialization: true
  raw_newest_file_selection_forbidden: true
  numeric_highest_selection_forbidden: true
  database_max_selection_forbidden: true

responsibilities:
  - own q_template Domain identity and Domain-wide composition policy
  - compose the domain_instantiation Capability by governed CURRENT resolution without embedding a child version or child content hash in the parent Contract
  - preserve Q.Template generation as non-decisional repository materialization
  - bind target P1-P4 Stage generation to the exact resolved Stage Contract authorities recorded in resolved_stage_snapshot
  - preserve target repository physical placement as projection of the selected Stage authorities

non_responsibilities:
  - define or duplicate domain_instantiation Operation semantics owned by the Capability Contract
  - select a child Contract by raw file order, numeric highest version, or database maximum
  - create a second Runtime
  - redefine P2 Provider or Consumer business semantics
  - own P3 lifecycle semantics or P4 coordination semantics
  - claim Q.Gate PASS, Q.Activation, publication, or runtime ACTIVE

