forbidden:
  - exact child Contract version pin embedded in the parent Contract
  - child Contract content hash embedded in the parent Contract as composition authority
  - child Operation or Interface semantic duplication in the parent Domain Contract
  - P2A or P2B Stage/source namespace creation
  - inferred or relocated Stage paths outside selected Stage physical authority
  - local Gate or parallel verdict authority

acceptance:
  - parent and child Contracts have independent version lineages and semantic authority
  - parent resolves the child through governed CURRENT resolution and requires an exact resolved ref/hash before materialization
  - child private implementation changes do not by themselves require a parent Contract successor
  - P1 authority is V0174 with fixed skeleton and Capability/Operation overlay separation
  - P2 authority is V0114 with the exact 53-path Contract-owned physical manifest
  - P3 authority is V0144 selected through Q.Standard ACTIVE/CURRENT authority
  - P4 authority is V0140 selected through Q.Standard ACTIVE/CURRENT authority
  - no Gate PASS or runtime Activation claim is implied by this Contract
