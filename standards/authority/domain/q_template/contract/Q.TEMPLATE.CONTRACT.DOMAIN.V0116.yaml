  domain_payload_grammar: Opaque request/result payload grammar is owned by Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0106.
  p2_local_cross_domain_dependency: Q.Template has no ordinary cross-Domain business dependency in this Contract; target P2 is materialized from
    the current P2 Stage authority.
  p3_local_evolution_semantics: P3 semantics are generated into target repositories and are not redefined by q_template.
  p4_local_coordination_semantics: P4 semantics are generated into target repositories and are not redefined by q_template.
persistence_contract:
  required: false
  owner_domain_ref: q.template.domain.q_template
  database_objects: {}
  not_applicable_reason: Q.Template materialization is stateless; target-domain persistence is emitted only from the input Business Contract and
    current persistence standards.
payload_schema_bindings:
  applicability: NOT_APPLICABLE_AT_DOMAIN_LEVEL
  reason: Capability-local input/runtime_result schemas are owned by exact child Capability Contract.
  capability_payload_schema_binding_refs:
  - Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0106#/payload_schema_bindings
system_interface_declarations:
