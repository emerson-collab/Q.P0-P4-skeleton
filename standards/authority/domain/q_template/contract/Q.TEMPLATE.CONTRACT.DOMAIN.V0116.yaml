    capability_contract_ref: Q.TEMPLATE.CONTRACT.CAPABILITY.DOMAIN_INSTANTIATION@V0106
    owner_domain_ref: q.template.domain.q_template
    owner_domain_contract_ref: Q.TEMPLATE.CONTRACT.DOMAIN@V0116
    entry_scope: system_execution_entry
    surface: CALL
    kind: CALL_INVOKE
    method_ref: materialize_repository
    base_interface_semantics_redefined: false
    cross_domain_continuation_requires_p2: true
    transport_or_launcher_is_semantic_interface_authority: false
