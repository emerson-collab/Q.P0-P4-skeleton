responsibilities:
- own q_template Domain identity and one-capability composition policy
- accept one external governed Business Contract through a System Interface overlay on domain_instantiation materialize_repository
- compose exactly one domain_instantiation Capability Contract by exact ref and final content hash
- bind the exact P0-P4 Stage baseline used for repository generation
- require standard-determined content to be precompiled or deterministically projected before business/environment substitution
- require DRT, reference, hash, field, unresolved-variable and forbidden-path verification without issuing Gate or Activation verdicts
- compose the exact domain_instantiation Capability Contract by ref and content hash without duplicating child Operation semantics
- expose external system entry only as System Interface overlay on an exact child Capability Interface
- preserve same-Domain runtime Operation calls through P1 internal_call_invoke without direct handler access
- project generated repository code paths only from the exact current P0-P4 Stage DRT directory authorities
non_responsibilities:
- define or infer target business semantics not present in the input Business Contract
- own Operation Interface request response StableError or payload-schema semantics that belong to domain_instantiation
- treat P0-P4 as Q.Template Capabilities
- allocate target identities from numeric order
- own target Domain database objects
- redefine P0 runtime P2 Provider/Consumer P3 evolution or P4 coordination semantics
- generate Q.Gate PASS/FAIL or ACTIVE transitions
- create Module P2A P2B bridge or mapping-protocol semantics
- invent a Stage Pack physical repository path not declared by current Source
- own executable business Operation handlers directly at a Domain-level src/p1/q_template root
- create an internal-interface-package Q object, hierarchy level, Surface, Kind or field catalog
