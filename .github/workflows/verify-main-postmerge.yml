name: verify-main-postmerge
on:
  push:
    branches:
      - verify/main-postmerge-rds-v0151

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: verify merged main commit
        run: test "$(git rev-parse HEAD)" = "d90f851f9c06fb7d4522109b629381f4cb2dfcc4"
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run typecheck
      - name: obsolete governed-data helpers remain absent
        run: |
          test ! -e runtime/p2_governed_data_material_projection.ts
          test ! -e runtime/p2_google_drive_material_store.ts
          ! grep -R "projectP1GovernedDataToP2Material\|createGoogleDriveP2MaterialStore" runtime src tests spec
      - name: stale P1 Interface bindings remain absent
        run: |
          ! grep -R "Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@V0182#/interfaces" runtime src spec tests
          ! grep -R "Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@V0183#/interfaces" runtime src spec tests
      - run: npm test
