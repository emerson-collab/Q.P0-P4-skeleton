name: Temporary P1 route P0 runtime closure
on:
  push:
    branches:
      - chatgpt/p1-route-p0-runtime-closure
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run fixed P1 Business Runtime tests
        run: |
          node --experimental-transform-types --test \
            tests/p1/business_runtime/business_operation_registry.test.ts \
            tests/p1/business_runtime/stage_extension_contract.test.ts
      - run: npm test
