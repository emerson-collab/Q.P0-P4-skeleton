name: verify-rds-v0151
on:
  push:
    branches:
      - upgrade/rds-v0151-governed-data
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'
          cache: npm
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run typecheck
      - run: npm test
