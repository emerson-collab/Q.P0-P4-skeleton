name: Q.Workflow System Interface

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: q-workflow-system-interface-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invoke-q-workflow:
    uses: emerson-collab/Q.Workflow/.github/workflows/q-workflow-system-interface.yml@main
    with:
      event_name: ${{ github.event_name }}
      repository: ${{ github.repository }}
      target_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      ref: ${{ github.ref }}
      before_sha: ${{ github.event.before || '' }}
      pull_request_number: ${{ format('{0}', github.event.pull_request.number || '') }}
      sender: ${{ github.actor }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
